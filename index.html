<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (function (l) {
        if (l.search[1] === 'p') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          var params = new URLSearchParams(decoded);
          var p = params.get('p');
          var q = params.get('q');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + (p || '') + (q ? ('?' + q) : '') + l.hash
          );
        }
      }(window.location));
    </script>
    <meta name="description" content="منظفات الإيمان - متجر إلكتروني للمنظفات ومستحضرات التجميل بأسعار مميزة" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>منظفات الإيمان | كل احتياجات بيتك في مكان واحد</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
